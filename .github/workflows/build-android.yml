name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Sepolia RPC
        run: |
          git rev-parse --short HEAD
          grep -n "https://rpc.sepolia.org" lib/services/wallet_service.dart
          if grep -Rni "rcp.sepolia.org" lib; then
            echo "ERROR: Old Sepolia RPC typo found"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android project files
        run: flutter create . --project-name albarka_p2p_wallet --platforms=android

      - name: Set ALBARKA P2P app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/drawable
          convert logo.png -strip -resize 512x512 -background none -alpha on android/app/src/main/res/drawable/albarka_logo.png
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/albarka_logo"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/albarka_logo"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
      - name: Inspect APK for Sepolia RPC
        run: |
          echo "Checking APK for old RPC..."
          if strings build/app/outputs/flutter-apk/app-release.apk | grep -F "rcp.sepolia.org"; then
            echo "ERROR: APK contains old RPC: rcp.sepolia.org"
            exit 1
          fi

          if strings build/app/outputs/flutter-apk/app-release.apk | grep -F "rpc.sepolia.org"; then
            echo "OK: APK contains rpc.sepolia.org"
          else
            echo "WARNING: rpc.sepolia.org not found as plain text in APK"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: albarka-p2p-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
