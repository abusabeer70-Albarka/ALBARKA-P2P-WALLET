name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Sepolia RPC configuration
        run: |
          git rev-parse --short HEAD
          grep -n "ALCHEMY_SEPOLIA_RPC" lib/services/wallet_service.dart
          grep -n "ALCHEMY_API_KEY" lib/services/wallet_service.dart

          if grep -Rni "rcp.sepolia.org" lib; then
            echo "ERROR: Old Sepolia RPC typo found"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android project files
        run: flutter create . --project-name albarka_p2p_wallet --platforms=android

      - name: Remove generated Flutter test
        run: |
          rm -rf test

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in s:
              s = s.replace("<manifest ", "<manifest ", 1)
              manifest_end = s.find(">")
              s = s[:manifest_end + 1] + "\n" + permission + s[manifest_end + 1:]
              p.write_text(s)

          print("Android INTERNET permission verified.")
          PYTHON

      - name: Set ALBARKA P2P app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/drawable
          convert logo.png -strip -resize 512x512 -background none -alpha on android/app/src/main/res/drawable/albarka_logo.png
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/albarka_logo"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"/android:roundIcon="@drawable\/albarka_logo"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Verify web3dart
        run: |
          flutter pub deps | grep -A 3 -B 3 web3dart
          grep -n "web3dart" pubspec.lock

      - name: Inspect web3dart package
        run: |
          WEB3DART_PATH=$(find "$PUB_CACHE" -maxdepth 4 -type d -name "web3dart-*" | head -1)
          echo "web3dart path: $WEB3DART_PATH"

          echo "=== EthereumAddress ==="
          grep -Rni "EthereumAddress" "$WEB3DART_PATH/lib" | head -20

          echo "=== EtherAmount ==="
          grep -Rni "EtherAmount" "$WEB3DART_PATH/lib" | head -20

          echo "=== EtherUnit ==="
          grep -Rni "EtherUnit" "$WEB3DART_PATH/lib" | head -20

          echo "=== EthPrivateKey ==="
          grep -Rni "EthPrivateKey" "$WEB3DART_PATH/lib" | head -20

          echo "=== Transaction ==="
          echo "=== web3dart.dart exports ==="
          sed -n '1,120p' "$WEB3DART_PATH/lib/web3dart.dart"
          grep -Rni "class Transaction" "$WEB3DART_PATH/lib" | head -10

      - name: Inspect main.dart before analyze
        run: |
          echo "=== CURRENT COMMIT ==="
          git rev-parse --short HEAD
          echo "=== MAIN DART LOCATION ==="
          pwd
          find . -name main.dart -type f -print
          echo "=== LIB MAIN DART 188-205 ==="
          nl -ba lib/main.dart | sed -n "188,205p"
          echo "=== BACKUPSCREEN ==="
          grep -n -A6 -B2 "class BackupScreen" lib/main.dart

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        env:
          ALCHEMY_SEPOLIA_RPC: ${{ secrets.ALCHEMY_SEPOLIA_RPC }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: |
          if [ -z "$ALCHEMY_SEPOLIA_RPC" ]; then
            echo "ERROR: ALCHEMY_SEPOLIA_RPC secret is empty."
            exit 1
          fi

          if [[ "$ALCHEMY_SEPOLIA_RPC" != https://eth-sepolia.g.alchemy.com/v2/* ]]; then
            echo "ERROR: ALCHEMY_SEPOLIA_RPC is not a valid Alchemy Sepolia URL."
            exit 1
          fi

          echo "ALCHEMY_SEPOLIA_RPC is configured correctly."
          if [ -z "$ALCHEMY_API_KEY" ]; then
            echo "ERROR: ALCHEMY_API_KEY secret is empty."
            exit 1
          fi

          echo "ALCHEMY_API_KEY is configured."
          flutter build apk --release \
            --dart-define=ALCHEMY_SEPOLIA_RPC="$ALCHEMY_SEPOLIA_RPC" \
            --dart-define=ALCHEMY_API_KEY="$ALCHEMY_API_KEY"

      - name: Inspect APK for Sepolia RPC
        run: |
          echo "Checking APK for old RPC..."
          if strings build/app/outputs/flutter-apk/app-release.apk | grep -F "rcp.sepolia.org"; then
            echo "ERROR: APK contains old RPC: rcp.sepolia.org"
            exit 1
          fi

          echo "APK build completed successfully."


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: albarka-p2p-wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
